name: Issue 330 normalize Rust batch

on:
  push:
    branches:
      - chatgpt/issue-330-test-first
    paths:
      - .github/workflows/issue330-format-compile.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/issue-330-test-first
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Repair finite constructor fallout and format
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              if text.count(old) != 1:
                  raise RuntimeError(f'{path}: expected exact source once')
              p.write_text(text.replace(old, new, 1))

          replace(
              'crates/workspace-engine/src/patch_lifecycle.rs',
              '''            schemas: BTreeMap::new(),\n            entities: BTreeMap::new(),\n        };''',
              '''            schemas: BTreeMap::new(),\n            entities: BTreeMap::new(),\n            keyed_grouped_sum_definitions: BTreeMap::new(),\n        };''',
          )
          replace(
              'crates/storage/tests/adversarial_conformance.rs',
              '''        )]),\n    }\n}\n\nfn number_source''',
              '''        )]),\n        keyed_grouped_sum_definitions: BTreeMap::new(),\n    }\n}\n\nfn number_source''',
          )
          replace(
              'crates/merge-engine/tests/three_way_merge.rs',
              '''        )]),\n    }\n}\n\nfn number_field''',
              '''        )]),\n        keyed_grouped_sum_definitions: BTreeMap::new(),\n    }\n}\n\nfn number_field''',
          )
          replace(
              'crates/workspace-engine/src/keyed_grouped_sum_operations.rs',
              '''    Document, Entity, EntityId, FieldId, FieldRef, KeyedGroupedSumDefinition,\n    KeyedGroupedSumDefinitionId, Number, Value, validate_keyed_grouped_sum_definitions,''',
              '''    Document, Entity, EntityId, FieldId, FieldRef, KeyedGroupedSumDefinitionId, Number, Value,\n    validate_keyed_grouped_sum_definitions,''',
          )
          replace(
              'crates/workspace-engine/src/keyed_grouped_sum_operations.rs',
              '''        Document, Entity, EntityId, EntityKey, Expression, FieldDefinition, FieldId, FieldKey,\n        FieldRef, FieldType, KeyedGroupedSumDefinition, KeyedGroupedSumDefinitionId,''',
              '''        Document, Entity, EntityId, EntityKey, Expression, FieldDefinition, FieldId, FieldKey,\n        FieldType, KeyedGroupedSumDefinition, KeyedGroupedSumDefinitionId,''',
          )
          PY
          cargo fmt --all
          cargo check --workspace --all-targets --locked
          git diff --check
      - name: Commit and remove helper
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/issue330-format-compile.yml
          git add crates
          git commit -m 'fix: restore issue 330 workspace compilation'
          git push origin HEAD:chatgpt/issue-330-test-first
