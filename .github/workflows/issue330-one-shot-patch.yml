name: Issue 330 one-shot source patch

on:
  push:
    branches:
      - chatgpt/issue-330-test-first
    paths:
      - .github/workflows/issue330-one-shot-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/issue-330-test-first
          fetch-depth: 0
      - name: Apply exact source patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          research = Path('crates/storage/src/roproj/v1/issue_175_research.rs')
          lines = research.read_text().splitlines(keepends=True)
          starts = [
              index
              for index, line in enumerate(lines)
              if line.lstrip().startswith('Document {') or '= Document {' in line
          ]
          if len(starts) != 6:
              raise RuntimeError(f'expected 6 direct Document literals, found {len(starts)}')

          patched = 0
          for start in reversed(starts):
              line = lines[start]
              indent = line[: len(line) - len(line.lstrip())]
              end = None
              for index in range(start + 1, len(lines)):
                  candidate = lines[index]
                  candidate_indent = candidate[: len(candidate) - len(candidate.lstrip())]
                  if candidate_indent == indent and candidate.strip() in ('}', '};'):
                      end = index
                      break
              if end is None:
                  raise RuntimeError(f'no matching rustfmt close for Document literal at line {start + 1}')
              body = ''.join(lines[start:end])
              if 'keyed_grouped_sum_definitions' in body:
                  continue
              lines.insert(
                  end,
                  f'{indent}    keyed_grouped_sum_definitions: BTreeMap::new(),\n',
              )
              patched += 1
          if patched != 6:
              raise RuntimeError(f'expected 6 legacy Document literals to patch, patched {patched}')
          research.write_text(''.join(lines))

          merge = Path('crates/merge-engine/src/lib.rs')
          text = merge.read_text()
          replacements = [
              (
                  '''pub enum MergeOutcome {\n    Merged(MergeCandidate),\n    Conflicted(Vec<MergeConflict>),\n}''',
                  '''pub enum MergeOutcome {\n    Merged(MergeCandidate),\n    Conflicted(Vec<MergeConflict>),\n    UnsupportedKeyedGroupedSumDefinitionChange,\n}''',
              ),
              (
                  '''pub fn merge(base: &Document, ours: &Document, theirs: &Document) -> MergeOutcome {\n    let mut conflicts = Vec::new();''',
                  '''pub fn merge(base: &Document, ours: &Document, theirs: &Document) -> MergeOutcome {\n    if base.keyed_grouped_sum_definitions != ours.keyed_grouped_sum_definitions\n        || base.keyed_grouped_sum_definitions != theirs.keyed_grouped_sum_definitions\n    {\n        return MergeOutcome::UnsupportedKeyedGroupedSumDefinitionChange;\n    }\n\n    let mut conflicts = Vec::new();''',
              ),
              (
                  '''            title,\n            schemas,\n            entities,\n        },''',
                  '''            title,\n            schemas,\n            entities,\n            keyed_grouped_sum_definitions: base.keyed_grouped_sum_definitions.clone(),\n        },''',
              ),
          ]
          for old, new in replacements:
              if text.count(old) != 1:
                  raise RuntimeError(f'unexpected merge-engine source for replacement: {old[:40]!r}')
              text = text.replace(old, new, 1)
          merge.write_text(text)
          PY

          cargo fmt --all
          git diff --check
      - name: Commit product patch and remove helper
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/issue330-one-shot-patch.yml
          git add crates/storage/src/roproj/v1/issue_175_research.rs crates/merge-engine/src/lib.rs
          git commit -m 'feat: enforce grouped-sum legacy merge boundaries'
          git push origin HEAD:chatgpt/issue-330-test-first
