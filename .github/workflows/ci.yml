name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Rust quality and product workflows
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install pnpm
        uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
        with:
          node-version-file: false
          version: 12.11.2
          install: false

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: experiments/open-sheet-export/pnpm-lock.yaml

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Validate documentation consistency
        run: bash scripts/docs-consistency-check.sh

      - name: Validate Codex repository tooling
        run: |
          bash scripts/codex-worktree-gc-check.sh
          bash scripts/codex-cargo-check.sh

      - name: Verify ADR-0016 workspace dependencies
        run: node scripts/workspace-dependency-check.mjs

      - name: Install open-sheet experimental dependencies
        run: pnpm --dir experiments/open-sheet-export install --frozen-lockfile

      - name: Lint all targets
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Run all tests
        run: cargo test --workspace --all-targets --locked

      - name: Execute native/WASM portable semantic conformance
        run: bash scripts/portable-conformance-check.sh

      - name: Check documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps --locked

      - name: Validate Cargo source packages
        run: cargo package --workspace --locked --no-verify

      - name: Exercise the standalone Game Dev Alpha journey
        run: |
          inherited_git_dir="${RUNNER_TEMP}/tachiko-standalone-bare.git"
          git init --bare --quiet "${inherited_git_dir}"
          GIT_DIR="${inherited_git_dir}" TMPDIR="${GITHUB_WORKSPACE}" \
            bash scripts/first-user-smoke.sh

      - name: Exercise the collaboration journey
        run: bash scripts/collaboration-smoke.sh

      - name: Exercise the entity lifecycle journey
        run: bash scripts/entity-lifecycle-smoke.sh

      - name: Exercise the formula authoring journey
        run: bash scripts/formula-authoring-smoke.sh

      - name: Exercise the optional Git-native Game Dev Alpha journey
        run: bash scripts/git-ci-smoke.sh

  browser-client-release-gate:
    name: Browser client release-equivalent gate
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust
        id: rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown

      - name: Cache browser release Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: browser-release-gate

      - name: Install pnpm
        uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
        with:
          node-version-file: false
          version: 12.11.2
          install: false

      - name: Install Node.js
        id: node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: packages/browser-client/pnpm-lock.yaml

      - name: Install browser client qualification dependencies
        run: pnpm --dir packages/browser-client install --frozen-lockfile

      - name: Install ripgrep for source-boundary checks
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends ripgrep

      - name: Install Chromium
        run: pnpm --dir packages/browser-client exec playwright install --with-deps chromium

      - name: Install minimum supported Rust for full release gate
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: 1.85.0
          targets: wasm32-unknown-unknown

      - name: Validate complete release-equivalent gate once
        id: full-release
        shell: bash
        run: |
          set -o pipefail
          evidence="${RUNNER_TEMP}/scalar-carrier-evidence"
          mkdir -p "${evidence}/rectangle/native"
          TACHIKO_RECTANGULAR_EVIDENCE="${evidence}/rectangle/native" \
            TACHIKO_V3_CI_EVIDENCE_ROOT="${RUNNER_TEMP}/date-definition-save-v3" \
            bash scripts/release-check.sh 2>&1 | tee "${evidence}/release-check.log"

      - name: Preserve v3 native and Worker acceptance diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: date-definition-save-v3-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/date-definition-save-v3/
          if-no-files-found: warn
          retention-days: 7
          compression-level: 0

      - name: Preserve native acceptance log and immediate release failure diagnostics
        if: ${{ !cancelled() && steps.full-release.outcome != 'skipped' }}
        shell: bash
        run: |
          evidence="${RUNNER_TEMP}/scalar-carrier-evidence"
          cp "${evidence}/release-check.log" "${evidence}/rectangle/native.log"

      - name: Upload immediate release failure diagnostics
        if: ${{ !cancelled() && steps.full-release.outcome == 'failure' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-failure-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/scalar-carrier-evidence/release-check.log
          if-no-files-found: error
          retention-days: 7

      # Before the job split this native evidence travelled in the scalar-carrier artifact.
      - name: Preserve native rectangular-capacity evidence on success or failure
        if: ${{ always() && steps.full-release.outcome != 'skipped' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-native-evidence-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/scalar-carrier-evidence/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  carrier-native:
    name: Browser client carrier native acceptance
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust
        id: rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown

      - name: Cache browser carrier native Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: browser-carrier-capacity-native

      - name: Exercise focused native scalar-carrier acceptance
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' && steps.rust.outcome == 'success' }}
        shell: bash
        run: |
          set -o pipefail
          evidence="${RUNNER_TEMP}/scalar-carrier-evidence"
          mkdir -p "${evidence}"
          cargo test --manifest-path packages/browser-client/runtime/Cargo.toml --locked --test interop_adapter 2>&1 | tee "${evidence}/native-acceptance.log"

      - name: Preserve carrier-native evidence on success or failure
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: carrier-native-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/scalar-carrier-evidence/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  carrier-foundation:
    name: Browser client carrier foundation
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust
        id: rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown

      - name: Cache browser carrier foundation Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: browser-carrier-capacity-foundation

      - name: Install pnpm
        uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
        with:
          node-version-file: false
          version: 12.11.2
          install: false

      - name: Install Node.js
        id: node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: packages/browser-client/pnpm-lock.yaml

      - name: Build exact scalar-carrier WASM evidence
        id: scalar-carrier-build
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' && steps.rust.outcome == 'success' && steps.node.outcome == 'success' }}
        shell: bash
        run: |
          set -o pipefail
          evidence="${RUNNER_TEMP}/scalar-carrier-evidence"
          mkdir -p "${evidence}"
          git diff --exit-code HEAD --
          git show --no-patch --format='%H%n%T%n%P' HEAD >"${evidence}/source-git.txt"
          sha256sum Cargo.lock packages/browser-client/runtime/Cargo.lock \
            packages/browser-client/runtime/src/interop_adapter.rs \
            packages/browser-client/runtime/src/interop_document.rs \
            packages/browser-client/runtime/src/lib.rs \
            packages/browser-client/runtime/src/wasm.rs \
            packages/browser-client/runtime/tests/interop_adapter.rs \
            packages/browser-client/runtime/tests/rectangular_capacity_acceptance.rs \
            acceptance/bounded-text-capacity/rectangle_oracle.py \
            acceptance/bounded-text-capacity/rectangle_wire.mjs \
            packages/browser-client/e2e/rectangular-capacity.mjs \
            acceptance/scalar-carrier/run.mjs acceptance/scalar-carrier/fixtures.py \
            .github/workflows/ci.yml >"${evidence}/source-files.sha256"
          { rustc -Vv; cargo -V; node --version; python3 --version; } >"${evidence}/toolchain.txt"
          bash packages/browser-client/scripts/build-runtime.sh "${evidence}/runtime" 2>&1 | tee "${evidence}/build.log"
          sha256sum "${evidence}/runtime/designer_runtime.wasm" >"${evidence}/wasm.sha256"

      - name: Exercise actual scalar-carrier WASM acceptance
        if: ${{ !cancelled() && steps.scalar-carrier-build.outcome == 'success' }}
        shell: bash
        run: |
          set -o pipefail
          evidence="${RUNNER_TEMP}/scalar-carrier-evidence"
          node acceptance/scalar-carrier/run.mjs "${evidence}/runtime/designer_runtime.wasm" "${evidence}/acceptance" 2>&1 | tee "${evidence}/acceptance.log"

      - name: Generate independent rectangular-capacity fixtures
        id: rectangle-fixtures
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' && steps.node.outcome == 'success' }}
        shell: bash
        run: |
          set -o pipefail
          evidence="${RUNNER_TEMP}/scalar-carrier-evidence/rectangle"
          mkdir -p "${evidence}"
          python3 acceptance/bounded-text-capacity/rectangle_oracle.py generate "${evidence}/fixtures" 2>&1 | tee "${evidence}/fixture-readback.log"

      - name: Exercise actual rectangular-capacity WASM acceptance
        id: rectangle-wire
        if: ${{ !cancelled() && steps.scalar-carrier-build.outcome == 'success' && steps.rectangle-fixtures.outcome == 'success' }}
        shell: bash
        run: |
          set -o pipefail
          evidence="${RUNNER_TEMP}/scalar-carrier-evidence"
          node acceptance/bounded-text-capacity/rectangle_wire.mjs "${evidence}/runtime/designer_runtime.wasm" \
            "${evidence}/rectangle/fixtures" "${evidence}/rectangle/wire" 2>&1 | tee "${evidence}/rectangle/wire.log"
          python3 acceptance/bounded-text-capacity/rectangle_oracle.py verify \
            "${evidence}/rectangle/wire" "${evidence}/rectangle/fixtures" 2>&1 | tee "${evidence}/rectangle/wire-oracle.log"

      - name: Qualify exact rectangular-capacity kit ABI
        id: rectangle-kit
        if: ${{ !cancelled() && steps.rectangle-wire.outcome == 'success' }}
        shell: bash
        run: |
          set -o pipefail
          evidence="${RUNNER_TEMP}/scalar-carrier-evidence"
          bash scripts/export-experimental-designer-client.sh "${evidence}/rectangle/kit" 2>&1 | tee "${evidence}/rectangle/kit.log"
          sha256sum "${evidence}/rectangle/kit/artifact-manifest.json" >"${evidence}/rectangle/kit-manifest.sha256"
          sha256sum "${evidence}/rectangle/kit/designer_runtime.wasm" >"${evidence}/rectangle/kit-wasm.sha256"
          if cmp --silent "${evidence}/runtime/designer_runtime.wasm" "${evidence}/rectangle/kit/designer_runtime.wasm"; then
            echo 'direct ABI proof covers byte-identical exported kit WASM' >"${evidence}/rectangle/kit-abi-binding.txt"
          else
            node acceptance/scalar-carrier/run.mjs "${evidence}/rectangle/kit/designer_runtime.wasm" "${evidence}/rectangle/kit-scalar" 2>&1 | tee "${evidence}/rectangle/kit-scalar.log"
            node acceptance/bounded-text-capacity/rectangle_wire.mjs "${evidence}/rectangle/kit/designer_runtime.wasm" \
              "${evidence}/rectangle/fixtures" "${evidence}/rectangle/kit-wire" 2>&1 | tee "${evidence}/rectangle/kit-wire.log"
            python3 acceptance/bounded-text-capacity/rectangle_oracle.py verify \
              "${evidence}/rectangle/kit-wire" "${evidence}/rectangle/fixtures" 2>&1 | tee "${evidence}/rectangle/kit-wire-oracle.log"
            echo 'exported kit WASM independently passed scalar and rectangular ABI proof' >"${evidence}/rectangle/kit-abi-binding.txt"
          fi

      - name: Record foundation evidence hashes
        id: foundation-hashes
        if: ${{ !cancelled() && steps.rectangle-kit.outcome == 'success' && steps.rectangle-fixtures.outcome == 'success' }}
        shell: bash
        run: |
          set -o pipefail
          evidence="${RUNNER_TEMP}/scalar-carrier-evidence"
          (
            cd "${evidence}"
            find runtime/designer_runtime.wasm rectangle/kit rectangle/fixtures -type f -print0 |
              sort -z | xargs -0 sha256sum
          ) >"${evidence}/foundation.sha256"

      - name: Preserve carrier-foundation evidence on success or failure
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: carrier-foundation-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/scalar-carrier-evidence/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  carrier-worker:
    name: Browser client carrier Worker acceptance
    needs: carrier-foundation
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Download carrier-foundation evidence
        id: download-foundation
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: carrier-foundation-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/scalar-carrier-evidence/

      - name: Verify foundation evidence hashes
        id: verify-foundation
        shell: bash
        run: |
          set -o pipefail
          cd "${RUNNER_TEMP}/scalar-carrier-evidence"
          sha256sum -c foundation.sha256

      - name: Install pnpm
        uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
        with:
          node-version-file: false
          version: 12.11.2
          install: false

      - name: Install Node.js
        id: node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: packages/browser-client/pnpm-lock.yaml

      - name: Install browser client qualification dependencies
        run: pnpm --dir packages/browser-client install --frozen-lockfile

      - name: Install Chromium
        run: pnpm --dir packages/browser-client exec playwright install --with-deps chromium

      - name: Exercise rectangular-capacity browser Worker acceptance
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' && steps.verify-foundation.outcome == 'success' && steps.node.outcome == 'success' }}
        shell: bash
        run: |
          set -o pipefail
          evidence="${RUNNER_TEMP}/scalar-carrier-evidence"
          pnpm --dir packages/browser-client exec node e2e/rectangular-capacity.mjs \
            "${evidence}/rectangle/kit" "${evidence}/rectangle/fixtures" "${evidence}/rectangle/worker" 2>&1 | tee "${evidence}/rectangle/worker.log"
          python3 acceptance/bounded-text-capacity/rectangle_oracle.py verify \
            "${evidence}/rectangle/worker" "${evidence}/rectangle/fixtures" 2>&1 | tee "${evidence}/rectangle/worker-oracle.log"

      - name: Preserve carrier-worker evidence on success or failure
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: carrier-worker-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/scalar-carrier-evidence/rectangle/worker
            ${{ runner.temp }}/scalar-carrier-evidence/rectangle/worker.log
            ${{ runner.temp }}/scalar-carrier-evidence/rectangle/worker-oracle.log
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  carrier-boundaries:
    name: Browser client carrier capacity boundaries
    needs: carrier-foundation
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Download carrier-foundation evidence
        id: download-foundation
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: carrier-foundation-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/scalar-carrier-evidence/

      - name: Verify foundation evidence hashes
        id: verify-foundation
        shell: bash
        run: |
          set -o pipefail
          cd "${RUNNER_TEMP}/scalar-carrier-evidence"
          sha256sum -c foundation.sha256

      - name: Install Rust
        id: rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown

      - name: Cache browser carrier boundaries Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: browser-carrier-capacity-boundaries

      - name: Install Node.js
        id: node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Exercise capacity boundaries against foundation bytes
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' && steps.rust.outcome == 'success' && steps.node.outcome == 'success' && steps.verify-foundation.outcome == 'success' }}
        shell: bash
        run: |
          set -o pipefail
          evidence="${RUNNER_TEMP}/scalar-carrier-evidence"
          cargo run --release --locked --manifest-path packages/browser-client/runtime/Cargo.toml \
            --example capacity_saved_open_boundaries -- all "${evidence}/rectangle/ordinary" 2>&1 | tee "${evidence}/rectangle/ordinary.log"
          node acceptance/bounded-text-capacity/ordinary-saved-open-wire.mjs \
            "${evidence}/rectangle/kit/designer_runtime.wasm" "${evidence}/rectangle/ordinary" "${evidence}/rectangle/ordinary-wire.json"
          cargo run --release --locked --manifest-path packages/browser-client/runtime/Cargo.toml \
            --example capacity_profile_boundaries -- all 2>&1 | tee "${evidence}/rectangle/profile-boundaries.log"
          python3 acceptance/bounded-text-capacity/oracle.py generate "${evidence}/rectangle/legacy-fixtures" 2>&1 | tee "${evidence}/rectangle/legacy-fixtures.log"
          PYTHONDONTWRITEBYTECODE=1 python3 acceptance/bounded-text-capacity/resource_fixtures.py "${evidence}/rectangle/legacy-fixtures"
          node acceptance/bounded-text-capacity/boundaries.mjs "${evidence}/rectangle/kit/designer_runtime.wasm" \
            "${evidence}/rectangle/legacy-fixtures" "${evidence}/rectangle/legacy-boundaries.json"

      - name: Preserve carrier-boundaries evidence on success or failure
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: carrier-boundaries-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/scalar-carrier-evidence/rectangle/ordinary
            ${{ runner.temp }}/scalar-carrier-evidence/rectangle/ordinary.log
            ${{ runner.temp }}/scalar-carrier-evidence/rectangle/ordinary-wire.json
            ${{ runner.temp }}/scalar-carrier-evidence/rectangle/profile-boundaries.log
            ${{ runner.temp }}/scalar-carrier-evidence/rectangle/legacy-fixtures
            ${{ runner.temp }}/scalar-carrier-evidence/rectangle/legacy-fixtures.log
            ${{ runner.temp }}/scalar-carrier-evidence/rectangle/legacy-boundaries.json
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  carrier-evidence:
    name: Browser client carrier evidence
    needs: [carrier-native, carrier-foundation, carrier-worker, carrier-boundaries]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    steps:
      - name: Require every carrier lane to succeed
        env:
          CARRIER_NATIVE_RESULT: ${{ needs.carrier-native.result }}
          CARRIER_FOUNDATION_RESULT: ${{ needs.carrier-foundation.result }}
          CARRIER_WORKER_RESULT: ${{ needs.carrier-worker.result }}
          CARRIER_BOUNDARIES_RESULT: ${{ needs.carrier-boundaries.result }}
        shell: bash
        run: |
          set -euo pipefail
          failed=0
          for lane in native foundation worker boundaries; do
            variable="CARRIER_$(echo "${lane}" | tr '[:lower:]' '[:upper:]')_RESULT"
            result="${!variable}"
            echo "carrier-${lane}: ${result}"
            if [[ "${result}" != 'success' ]]; then
              failed=1
            fi
          done
          exit "${failed}"

      - name: Download carrier-native evidence
        if: ${{ always() }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: carrier-native-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/scalar-carrier-evidence/

      - name: Download carrier-foundation evidence
        if: ${{ always() }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: carrier-foundation-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/scalar-carrier-evidence/

      - name: Download carrier-worker evidence
        if: ${{ always() }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: carrier-worker-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/scalar-carrier-evidence/rectangle/

      - name: Download carrier-boundaries evidence
        if: ${{ always() }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: carrier-boundaries-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/scalar-carrier-evidence/rectangle/

      - name: Verify foundation evidence hashes
        if: ${{ always() }}
        shell: bash
        run: |
          set -o pipefail
          cd "${RUNNER_TEMP}/scalar-carrier-evidence"
          sha256sum -c foundation.sha256

      - name: Preserve scalar-carrier evidence on success or failure
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: scalar-carrier-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/scalar-carrier-evidence/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  operational-evidence:
    name: Strict operational evidence
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
        with:
          node-version-file: false
          version: 12.11.2
          install: false

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: tools/operational-evidence/pnpm-lock.yaml

      - name: Validate strict operational evidence
        run: bash scripts/operational-evidence-check.sh

  native-platforms:
    name: Native platform ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: macos-15-intel
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: ${{ matrix.target }}
          workspaces: |
            .
            packages/browser-client/runtime

      - name: Test native runtime crate
        run: cargo test --manifest-path packages/browser-client/runtime/Cargo.toml --locked --no-fail-fast --target ${{ matrix.target }}

      - name: Check release CLI
        run: cargo check --package tachiko-cli --locked --target ${{ matrix.target }}

  minimum-rust:
    name: Minimum supported Rust 1.85.0
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust 1.85.0
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: 1.85.0
          targets: wasm32-unknown-unknown

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Check all targets with Rust 1.85.0
        run: cargo check --workspace --all-targets --locked

      - name: Check browser client runtime with Rust 1.85.0
        run: cargo check --manifest-path packages/browser-client/runtime/Cargo.toml --target wasm32-unknown-unknown --all-targets --locked
