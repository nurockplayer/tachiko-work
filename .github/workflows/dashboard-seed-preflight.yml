name: Dashboard operational seed preflight
on:
  push:
    branches: ["chatgpt/issue-229-positive-only-acceptance"]
    paths: ["tools/project-dashboard/**", ".github/workflows/dashboard-seed-preflight.yml"]
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: 11.25.0
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
      - name: Materialize package-local seed dependency state (not a shipping gate)
        id: prepare
        run: |
          node --version
          pnpm --version
          pnpm --dir tools/project-dashboard install --no-frozen-lockfile
          git hash-object tools/project-dashboard/pnpm-lock.yaml
          pnpm --dir tools/project-dashboard install --frozen-lockfile
          pnpm --dir tools/project-dashboard exec playwright install --with-deps chromium
      - name: Export the generated lock without transcription
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dashboard-seed-lock
          path: tools/project-dashboard/pnpm-lock.yaml
          retention-days: 1
          if-no-files-found: error
      - name: Typecheck all seeded tests
        id: typecheck
        run: pnpm --dir tools/project-dashboard typecheck
      - name: Preserve existing acceptance
        run: pnpm --dir tools/project-dashboard test:acceptance
      - name: Existing unit and fixture self-checks
        run: pnpm --dir tools/project-dashboard exec vitest run tests/unit tests/harness
      - name: Operational HTTP and ingestion acceptance (deliberate stub RED)
        if: ${{ !cancelled() && steps.typecheck.outcome == 'success' }}
        run: pnpm --dir tools/project-dashboard test:operational
      - name: Real-browser acceptance (deliberate stub RED)
        if: ${{ !cancelled() && steps.typecheck.outcome == 'success' }}
        run: pnpm --dir tools/project-dashboard test:browser
