name: Project Dashboard acceptance

on:
  push:
    paths:
      - "tools/project-dashboard/**"
      - ".github/workflows/project-dashboard.yml"
  pull_request:
    paths:
      - "tools/project-dashboard/**"
      - ".github/workflows/project-dashboard.yml"

permissions:
  contents: read

concurrency:
  group: project-dashboard-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  acceptance:
    name: Dashboard typecheck and acceptance
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.25.0
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: tools/project-dashboard/pnpm-lock.yaml

      - name: Install Dashboard dependencies
        run: pnpm --dir tools/project-dashboard install --frozen-lockfile

      - name: Typecheck Dashboard acceptance seam
        run: pnpm --dir tools/project-dashboard typecheck

      - name: Execute Dashboard acceptance
        run: pnpm --dir tools/project-dashboard test:acceptance
