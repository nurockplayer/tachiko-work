name: Project Dashboard acceptance

on:
  push:
    paths:
      - "tools/project-dashboard/**"
      - ".github/workflows/project-dashboard.yml"
  pull_request:
    paths:
      - "tools/project-dashboard/**"
      - ".github/workflows/project-dashboard.yml"

permissions:
  contents: read

concurrency:
  group: project-dashboard-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  acceptance:
    name: Dashboard typecheck and acceptance
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
        with:
          node-version-file: false
          version: 12.11.2
          install: false

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: tools/project-dashboard/pnpm-lock.yaml

      - name: Install Dashboard dependencies
        run: pnpm --dir tools/project-dashboard install --frozen-lockfile

      - name: Install Dashboard browser
        run: pnpm --dir tools/project-dashboard exec playwright install --with-deps chromium

      - name: Typecheck Dashboard acceptance seam
        id: typecheck
        run: pnpm --dir tools/project-dashboard typecheck

      - name: Execute Dashboard projection acceptance
        run: pnpm --dir tools/project-dashboard test:acceptance

      - name: Execute Dashboard unit and fixture checks
        if: ${{ !cancelled() && steps.typecheck.outcome == 'success' }}
        run: pnpm --dir tools/project-dashboard exec vitest run tests/unit tests/harness

      - name: Execute full Dashboard suite
        if: ${{ !cancelled() && steps.typecheck.outcome == 'success' }}
        run: pnpm --dir tools/project-dashboard test

      - name: Execute Dashboard browser acceptance
        if: ${{ !cancelled() && steps.typecheck.outcome == 'success' }}
        run: pnpm --dir tools/project-dashboard test:browser

      - name: Validate local Worker bundle and browser smoke
        if: ${{ !cancelled() && steps.typecheck.outcome == 'success' }}
        run: pnpm --dir tools/project-dashboard test:worker
