[package]
name = "tachiko-cli"
description = "Git-native CLI for authoring, calculating, reviewing, and merging Tachiko Work documents"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true

[[bin]]
name = "tachiko"
path = "src/main.rs"

[dependencies]
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tachiko-storage = { version = "0.1.0", path = "../storage" }
tachiko-workspace-engine = { version = "0.1.0", path = "../workspace-engine" }
thiserror.workspace = true
uuid = { workspace = true, features = ["v7"] }

[dev-dependencies]
tachiko-storage = { version = "0.1.0", path = "../storage", features = ["issue-175-research"] }
tachiko-workspace-engine = { version = "0.1.0", path = "../workspace-engine", features = ["issue-175-research"] }

[lints]
workspace = true
