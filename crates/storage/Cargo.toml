[package]
name = "tachiko-storage"
description = "Canonical .ro document serialization and versioning for Tachiko Work"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true

[features]
issue-175-research = ["tachiko-semantic-core/issue-175-research"]

[dependencies]
serde.workspace = true
serde_json = { workspace = true, features = ["arbitrary_precision", "raw_value", "unbounded_depth"] }
tachiko-semantic-core = { version = "0.1.0", path = "../semantic-core" }
thiserror.workspace = true
uuid = { workspace = true, features = ["v5"] }
ryu-js.workspace = true
sha2.workspace = true
renamore.workspace = true

[dev-dependencies]
tachiko-semantic-core = { version = "0.1.0", path = "../semantic-core", features = ["issue-175-research"] }

[lints]
workspace = true
