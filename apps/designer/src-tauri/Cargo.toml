[package]
name = "tachiko-designer-desktop"
version = "0.1.0"
edition = "2024"
publish = false
rust-version = "1.85"
build = "build.rs"

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[target.'cfg(target_os = "macos")'.dependencies]
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "=2.11.5", default-features = false, features = ["wry"] }

[workspace]

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "deny"
pedantic = "warn"
