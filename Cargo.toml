[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Tachiko Work Contributors"]
license = "Apache-2.0 OR MIT"
repository = "https://github.com/nurockplayer/tachiko-work"
homepage = "https://github.com/nurockplayer/tachiko-work"
readme = "README.md"
keywords = ["semantic", "game-development", "git", "data", "cli"]
categories = ["command-line-utilities", "data-structures", "game-development"]
rust-version = "1.85"

[workspace.dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "deny"
pedantic = "warn"
