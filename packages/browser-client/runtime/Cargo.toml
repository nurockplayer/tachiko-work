[package]
name = "tachiko-designer-runtime"
version = "0.1.0"
edition = "2024"
publish = false
rust-version = "1.85"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tachiko-storage = { path = "../../../crates/storage" }
tachiko-workspace-engine = { path = "../../../crates/workspace-engine" }
thiserror = "2.0"
quick-xml = "0.37"
zip = { version = "=2.4.2", default-features = false, features = ["deflate"] }

[workspace]

[lints.rust]
# This crate-level exception exists only because the browser bridge uses Rust
# 2024 `#[unsafe(no_mangle)]` on its private C ABI exports. It is not permission
# to add unsafe blocks, unsafe functions, unsafe impls, or unrelated unsafe
# attributes; expanding that surface requires explicit Issue scope and Guarded
# review under the repository Rust ownership/unsafe policy in AGENTS.md.
unsafe_code = "allow"

[lints.clippy]
all = "deny"
pedantic = "warn"
